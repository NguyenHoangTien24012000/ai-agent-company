<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Công ty SportsHub</title>
<style>
:root{color-scheme:light dark;--bg:#f2f4f7;--panel:#fff;--ink:#192638;--muted:#586779;--line:#d8e0e8;--accent:#126b57;--tint:#e7f4ee;--warn:#8a5000;--bad:#b52d38;--soft:#eaf0f6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 system-ui,-apple-system,sans-serif}button,input,textarea{font:inherit}a{color:var(--accent);overflow-wrap:anywhere}button{cursor:pointer;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--ink);padding:6px 10px}button:hover{border-color:var(--accent)}button:disabled{cursor:wait;opacity:.55}button.recommend{background:var(--accent);color:white;border-color:var(--accent)}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}header{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:19px;margin:0;letter-spacing:-.5px}h2{font-size:16px;margin:0;display:flex;gap:8px;align-items:center}h3{font-size:14px;margin:0}p{margin:5px 0}main{max-width:1600px;margin:auto;padding:20px 24px 36px;display:grid;gap:22px}.meta,.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.meta{color:var(--muted)}.pill{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:2px 6px;display:inline-block}.accent{color:var(--accent)}.warn{color:var(--warn)}.bad{color:var(--bad)}.muted,small{color:var(--muted)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}.count{font-size:11px;background:var(--soft);padding:1px 7px;border-radius:9px}.queue{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,350px),1fr));gap:10px}.card{min-width:0;border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:13px;overflow-wrap:anywhere}.ask{border-top:3px solid var(--accent)}.ask.boss-bug{border-top-color:var(--warn)}.ask h3{margin:7px 0}.context{white-space:pre-wrap;margin:8px 0}.context code,code{font:12px ui-monospace,monospace;background:var(--soft);padding:1px 4px;border-radius:3px;overflow-wrap:anywhere}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}textarea{display:block;width:100%;min-height:38px;resize:vertical;padding:7px 8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:5px;margin-top:4px}label{display:block;margin-top:10px;font-size:12px;color:var(--muted)}.links{display:flex;gap:5px 12px;flex-wrap:wrap;margin-top:7px;font-size:12px}.rooms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.room-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:3px}.room-key{font-weight:750;letter-spacing:.7px;color:var(--accent)}.branch{font:11px ui-monospace,monospace;color:var(--muted);margin:6px 0 10px}.steps{list-style:none;padding:0;margin:10px 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}.steps li{font-size:10px;padding:5px 3px;text-align:center;background:var(--bg);border-radius:3px;color:var(--muted)}.steps .passed{color:var(--accent);background:var(--tint)}.steps .current{color:white;background:var(--accent);font-weight:700}.gates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:10px 0}.gate{font-size:11px;background:var(--bg);border:1px solid var(--line);padding:5px 6px;border-radius:4px}.gate.approved{background:var(--tint);color:var(--accent)}.gate.pending{color:var(--warn)}.gate span{display:block;color:var(--muted);font-size:10px}.lane{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;border-top:1px solid var(--line);padding:6px 0}.lane small{grid-column:1/-1}.lane-state{font-size:11px}.subheading{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:12px 0 5px}.bugs{border-top:1px solid var(--line);margin-top:10px;padding-top:9px}summary{cursor:pointer}.bug{margin-top:8px;padding:8px;background:var(--bg);border-radius:4px}.evidence,.overlap{padding:8px;margin-top:10px;border-radius:4px;background:var(--bg);font-size:12px}.evidence details{margin-top:5px}.events{border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}.event{padding:7px 12px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:135px 100px minmax(0,1fr);gap:10px;font-size:12px}.event:last-child{border-bottom:0}.event-message{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty{padding:18px;border:1px dashed var(--line);border-radius:5px;color:var(--muted)}#notice{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:min(620px,calc(100% - 24px));background:var(--ink);color:var(--panel);border-radius:7px;box-shadow:0 4px 24px #0003;padding:12px 15px;z-index:10;overflow-wrap:anywhere}#notice[hidden]{display:none}#notice textarea{min-height:65px}#notice button{margin-top:8px}.sample-label{color:var(--warn)}
@media(max-width:1050px){.rooms{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){header{padding:13px 14px}main{padding:16px 12px 28px;gap:20px}.rooms,.queue{grid-template-columns:1fr}.meta{gap:5px 10px;font-size:11px}.card{padding:11px}.event{grid-template-columns:76px 75px minmax(0,1fr);gap:6px;padding:8px;font-size:11px}.event time{font-size:10px}.section-head{align-items:baseline}.section-head>small{text-align:right;font-size:10px}}
@media(prefers-color-scheme:dark){:root{--bg:#111920;--panel:#1a2530;--ink:#e1e9f0;--muted:#a5b4c3;--line:#344453;--accent:#78d7b8;--tint:#213e37;--warn:#f1bd6a;--bad:#ff9399;--soft:#2b3948}.recommend,.steps .current{color:#11281f!important}}
</style>
</head>
<body>
<header><h1>Công ty SportsHub</h1><div class="meta"><span id="key-holder">Chìa khoá app: —</span><span class="pill" id="connection">Đang tải</span><span id="updated">Cập nhật: —</span><span id="sample-label" class="sample-label" hidden>Dữ liệu mẫu</span></div></header>
<main>
<section aria-labelledby="queue-title"><div class="section-head"><h2 id="queue-title">Việc của anh <span class="count" id="queue-count">0</span></h2><small>Cũ nhất trước · im lặng chưa phải đồng ý</small></div><div class="queue" id="queue"></div></section>
<section aria-labelledby="rooms-title"><div class="section-head"><h2 id="rooms-title">Các phòng <span class="count" id="room-count">0</span></h2><small>12 bước · 6 cổng duyệt</small></div><div class="rooms" id="rooms"></div></section>
<section aria-labelledby="events-title"><div class="section-head"><h2 id="events-title">Nhật ký <span class="count" id="event-count">0</span></h2><small>50 sự kiện mới nhất</small></div><div class="events" id="events"></div></section>
</main>
<div id="notice" role="status" aria-live="polite" hidden></div>
<script>
'use strict';
const STEPS=['hoi-dap','cho-goi','thiet-ke','kien-truc','ke-hoach-test','code','test','review','cho-check','chuan-bi-gop','cho-gop','xong'];
const STEP_LABELS=['Hỏi đáp','Chờ gói','Thiết kế','Kiến trúc','Kế hoạch test','Code','Test','Review','Chờ check','Chuẩn bị gộp','Chờ gộp','Xong'];
const GATES=['Gói phòng + hồ sơ tính năng','Bản ý tưởng thiết kế','Giao diện mẫu','Thiết kế Techlead','Check cuối (QA + review)','Cho gộp + push'];
const STATUS={active:'Đang làm',done:'Xong',cancelled:'Đã huỷ',running:'Đang chạy',waiting:'Đang chờ',closed:'Đã đóng',open:'Đang mở',fixing:'Đang sửa',retest:'Chờ kiểm lại',deferred:'Dời backlog'};
const KINDS={duyet:'Duyệt',quyet:'Quyết định',thaotac:'Thao tác'};
const EVENT_LABELS={room_opened:'Mở phòng',room_changed:'Cập nhật phòng',room_done:'Hoàn tất phòng',lane_changed:'Cập nhật lane',ask_opened:'Cần trả lời',ask_resolved:'Đã trả lời',ask_reopened:'Mở lại câu hỏi',ask_cancelled:'Rút câu hỏi',bug_opened:'Ghi nhận lỗi',bug_changed:'Cập nhật lỗi',key_requested:'Xin chìa khoá app (xếp hàng)',key_taken:'Nhận chìa khoá app',key_released:'Trả chìa khoá app',overlap:'File trùng giữa phòng',evidence:'Đối chiếu bằng chứng',note:'Ghi chú',lane_stale:'Lane đứng yên',thu_ky_silent:'Thư ký im lặng'};
const sample=new URLSearchParams(location.search).get('sample')==='1';
let online=false,snapshot={rooms:[],myQueue:[],events:[]},refreshing=false,queueSignature='',roomSignature='',eventSignature='';
const drafts=new Map(),pending=new Set();
const $=id=>document.getElementById(id);
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
function dateText(value){const date=new Date(value);return Number.isNaN(+date)?'—':date.toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'});}
function age(value){const minutes=Math.max(0,Math.floor((Date.now()-new Date(value))/60000));if(!Number.isFinite(minutes))return '—';return minutes<1?'Vừa xong':minutes<60?minutes+' phút':minutes<1440?Math.floor(minutes/60)+' giờ':Math.floor(minutes/1440)+' ngày';}
function safeUrl(value,room){const raw=String(value??'').trim();if(!raw||/[\u0000-\u001f\u007f]/.test(raw)||raw.startsWith('//')||raw.includes('\\'))return null;try{let base=location.href;if(room?.worktree)base=new URL('file://'+room.worktree.replace(/\/$/,'')+'/').href;const url=new URL(raw,base);return ['https:','http:','file:'].includes(url.protocol)?url.href:null;}catch{return null;}}
function link(value,label,room){const href=safeUrl(value,room);return href?`<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label||value)}</a>`:escapeHtml(label||value);}
// Chỉ xử lý các dấu markdown cho phép; mọi nội dung khác đều được thoát HTML.
function markdown(value,room){const text=String(value??'');const pattern=/`([^`\n]+)`|\*\*([^*\n]+)\*\*|\[([^\]\n]+)\]\(([^\s)]+)\)/g;let result='',last=0;for(const match of text.matchAll(pattern)){result+=escapeHtml(text.slice(last,match.index));result+=match[1]?`<code>${escapeHtml(match[1])}</code>`:match[2]?`<strong>${escapeHtml(match[2])}</strong>`:link(match[4],match[3],room);last=match.index+match[0].length;}return result+escapeHtml(text.slice(last));}
function renderQueue(items){$('queue-count').textContent=items.length;const signature=JSON.stringify(items);if(signature===queueSignature){document.querySelectorAll('[data-age]').forEach(node=>node.textContent=age(node.dataset.age));return;}queueSignature=signature;const focus=document.activeElement;const focusId=focus?.dataset?.note;const selection=focusId?[focus.selectionStart,focus.selectionEnd]:null;
 $('queue').innerHTML=items.length?items.map(item=>{const room=snapshot.rooms.find(room=>room.key===item.room);const isBug=!item.kind;return `<article class="card ask ${isBug?'boss-bug':''}"><div class="row"><strong>${escapeHtml(item.room)}</strong><span class="pill">${escapeHtml(isBug?'Lỗi cần anh quyết':KINDS[item.kind]||item.kind)}</span>${item.gate?`<span class="pill">Cổng ${escapeHtml(item.gate)}</span>`:''}<small data-age="${escapeHtml(item.createdAt)}" title="${escapeHtml(dateText(item.createdAt))}">${age(item.createdAt)}</small></div><h3>${escapeHtml(item.title)}</h3><small>${escapeHtml(item.id)}</small><div class="context">${markdown(isBug?item.steps:item.context,room)}</div><div class="links">${(isBug?item.shots||[]:item.links||[]).map(path=>link(path,path,room)).join('')}</div>${isBug?`<p class="warn">${escapeHtml(STATUS[item.status]||item.status)} · ${escapeHtml(item.assignee||'Chưa giao')}</p><p class="muted">Trao đổi với Manager để chốt hành vi; QA đóng lỗi sau khi kiểm lại.</p>`:`<label>Ghi chú cho ${escapeHtml(item.id)}<textarea data-note="${escapeHtml(item.id)}" placeholder="${(item.options||[]).some(option=>option.key==='tra-loi')?'Gõ câu trả lời của anh…':(item.options||[]).some(option=>option.key==='khac')?'Chỉ cần gõ khi chọn Khác (hoặc muốn ghi thêm)…':'Ghi rõ phần cần sửa hoặc lý do chọn…'}">${escapeHtml(drafts.get(item.id)||'')}</textarea></label><div class="actions">${(item.options||[]).map(option=>`<button type="button" data-ask="${escapeHtml(item.id)}" data-choice="${escapeHtml(option.key)}" class="${option.key===item.recommend?'recommend':''}" ${pending.has(item.id)?'disabled':''}>${escapeHtml(option.label)}${option.key===item.recommend?' · Đề xuất':''}</button>`).join('')}</div>`}</article>`;}).join(''):'<div class="empty">Chưa có việc cần anh trả lời.</div>';
 if(focusId){const replacement=[...document.querySelectorAll('[data-note]')].find(node=>node.dataset.note===focusId);if(replacement){replacement.focus({preventScroll:true});replacement.setSelectionRange(...selection);}}
}
function renderRooms(rooms){$('room-count').textContent=rooms.length;const signature=JSON.stringify([rooms,snapshot.appKey]);if(signature===roomSignature)return;roomSignature=signature;const expanded=new Set([...document.querySelectorAll('#rooms details[open]')].map(node=>node.dataset.detail));
 $('rooms').innerHTML=rooms.length?rooms.map(room=>{const bugs=room.bugs||[],index=STEPS.indexOf(room.step),evidence=[...(room.evidence||[])].sort((a,b)=>new Date(b.at)-new Date(a.at))[0];return `<article class="card"><div class="room-head"><span class="room-key">${escapeHtml(room.key)}</span><span class="pill">${escapeHtml(STATUS[room.status]||room.status)}${snapshot.appKey?.room===room.key?' · 🔑':''}</span></div><h3>${escapeHtml(room.title)}</h3><div class="branch">${escapeHtml(room.branch)}</div><ol class="steps" aria-label="Tiến độ phòng">${STEPS.map((step,i)=>`<li class="${i===index?'current':i<index?'passed':''}" ${i===index?'aria-current="step"':''}>${i+1}. ${STEP_LABELS[i]}</li>`).join('')}</ol><div class="gates">${GATES.map((title,i)=>{const approved=room.gates?.[i+1];const waiting=(room.asks||[]).some(ask=>ask.status==='open'&&(Number(ask.gate)===i+1||(ask.alsoGates||[]).includes(i+1)));return `<div class="gate ${approved?'approved':waiting?'pending':''}" title="${escapeHtml(approved?'Đã duyệt '+dateText(approved.at):waiting?'Đang chờ duyệt':'Chưa tới')}">${approved?'✓':waiting?'⏳':'–'} Cổng ${i+1}<span>${title}</span></div>`;}).join('')}</div><div class="subheading">Vai & lane</div>${(room.roles||[]).filter(role=>!(room.lanes||[]).some(lane=>lane.role===role)).map(role=>`<div class="lane"><span>${escapeHtml(role)}</span><span class="lane-state muted">Chưa mở lane</span></div>`).join('')}${(room.lanes||[]).map(lane=>`<div class="lane"><span>${escapeHtml(lane.role)} <small>· ${escapeHtml(lane.model||'—')}</small></span><span class="lane-state ${lane.status==='running'?'accent':'muted'}">${escapeHtml(STATUS[lane.status]||lane.status)}</span><small>${escapeHtml(lane.handle)}${lane.note?' · '+escapeHtml(lane.note):''}</small></div>`).join('')}<details class="bugs" data-detail="${escapeHtml(room.key)}-bugs"><summary><strong>Lỗi chưa đóng: ${bugs.filter(bug=>!['closed','deferred'].includes(bug.status)).length}</strong><br><small>${['open','fixing','retest','closed','deferred'].map(status=>`${STATUS[status]} ${bugs.filter(bug=>bug.status===status).length}`).join(' · ')}</small></summary>${bugs.length?bugs.map(bug=>`<div class="bug"><strong>${escapeHtml(bug.id)} · ${escapeHtml(bug.title)}</strong><p class="${bug.severity==='high'?'bad':'muted'}">${escapeHtml(STATUS[bug.status]||bug.status)} · ${escapeHtml(bug.area)} · ${bug.severity==='high'?'Mức cao':'Bình thường'} · ${escapeHtml(bug.assignee||'Chưa giao')}</p><div class="context">${markdown(bug.steps,room)}</div><div class="links">${(bug.shots||[]).map(path=>link(path,path,room)).join('')}</div></div>`).join(''):'<p class="muted">Chưa ghi nhận lỗi.</p>'}</details><div class="links">${Object.entries(room.links||{}).filter(([,path])=>path).map(([name,path])=>link(path,({spec:'Đặc tả',featureDoc:'Hồ sơ tính năng',nghiemThu:'Nghiệm thu',qaReport:'Báo cáo QA',review:'Review'})[name]||name,room)).join('')}</div>${(room.overlaps||[]).map(overlap=>`<div class="overlap warn">⚠️ Trùng file với <strong>${escapeHtml(overlap.with)}</strong>${overlap.conflict?' · Có xung đột':''}<br>${(overlap.files||[]).map(file=>`<code>${escapeHtml(file)}</code>`).join(' ')}</div>`).join('')}${evidence?`<div class="evidence ${evidence.ok?'accent':'bad'}">${evidence.ok?'✅':'❌'} ${escapeHtml(evidence.claim)}<br><small>${dateText(evidence.at)}</small><details data-detail="${escapeHtml(room.key)}-evidence"><summary>Bằng chứng gần nhất</summary><p>Manager: ${escapeHtml(evidence.manager)}</p><p>Thư ký: ${escapeHtml(evidence.thuKy)}</p><code>${escapeHtml(evidence.cmd)}</code></details></div>`:'<p class="muted">Chưa có bằng chứng đối chiếu.</p>'}</article>`;}).join(''):'<div class="empty">Chưa có phòng.</div>';
 document.querySelectorAll('#rooms details').forEach(node=>node.open=expanded.has(node.dataset.detail));
}
function renderEvents(events){$('event-count').textContent=events.length;const signature=JSON.stringify(events);if(signature===eventSignature)return;eventSignature=signature;$('events').innerHTML=events.length?events.map(event=>{const detail=[EVENT_LABELS[event.type]||event.type,event.title,event.text,event.message,event.note,event.askId||event.bugId,event.role&&event.handle?event.role+' '+event.handle:null,event.minutes!=null?event.minutes+' phút không động tĩnh':null,event.choice,event.status?STATUS[event.status]||event.status:null,event.claim,event.ok===false?'Không khớp':null].filter(Boolean).join(' · ');return `<div class="event"><time datetime="${escapeHtml(event.ts)}">${dateText(event.ts)}</time><strong>${escapeHtml(event.room||'Công ty')}</strong><span class="event-message" title="${escapeHtml(detail)}">${escapeHtml(detail)}</span></div>`;}).join(''):'<div class="empty">Chưa có sự kiện.</div>';}
function render(data){snapshot={...data,rooms:data.rooms||[],myQueue:data.myQueue||[],events:data.events||[]};$('connection').textContent=online?'● Đã nối':'○ Chỉ đọc file';$('connection').classList.toggle('accent',online);$('key-holder').textContent='🔑 Chìa khoá app: '+(snapshot.appKey?.room||'Chưa ai giữ')+((snapshot.keyQueue||[]).length?' · chờ: '+snapshot.keyQueue.map(q=>q.room).join(', '):'');$('updated').textContent='Cập nhật: '+dateText(snapshot.generatedAt);$('sample-label').hidden=!sample;renderQueue([...snapshot.myQueue].sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt)));renderRooms(snapshot.rooms);renderEvents([...snapshot.events].sort((a,b)=>new Date(b.ts)-new Date(a.ts)).slice(0,50));}
function notify(message,command){const node=$('notice');node.hidden=false;node.innerHTML=`<div>${escapeHtml(message)}</div>${command?`<textarea aria-label="Lệnh để chép" readonly>${escapeHtml(command)}</textarea>`:''}<button type="button">Đóng</button>`;node.querySelector('button').onclick=()=>node.hidden=true;if(command){node.querySelector('textarea').focus();node.querySelector('textarea').select();}}
// Giữ nguyên dạng lệnh dễ đọc, đồng thời bảo vệ ký tự shell trong lựa chọn và ghi chú.
function shellQuote(value){const text=String(value);return /^[a-zA-Z0-9_-]+$/.test(text)?text:"'"+text.replace(/'/g,"'\\''")+"'";}
async function copyCommand(askId,choice,note){const command=`python3 ~/sportshub-company/bin/company.py ask resolve ${shellQuote(askId)} --choice ${shellQuote(choice)} --via board${note?' --note '+shellQuote(note):''}`;let copied=false;try{await navigator.clipboard.writeText(command);copied=true;}catch{const textarea=document.createElement('textarea');textarea.value=command;textarea.style.cssText='position:fixed;left:0;top:0;opacity:0';document.body.append(textarea);textarea.select();try{copied=document.execCommand('copy');}catch{}textarea.remove();}notify(copied?'Đã chép, dán vào terminal Manager. Chưa ghi câu trả lời.':'Không thể tự chép. Chép lệnh bên dưới rồi dán vào terminal Manager.',command);}
async function refresh(){if(refreshing||sample||location.protocol==='file:')return;refreshing=true;try{const response=await fetch('/api/state',{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!response.ok)throw new Error('Không tải được trạng thái');const data=await response.json();if(!Array.isArray(data.rooms)||!Array.isArray(data.myQueue)||!Array.isArray(data.events))throw new Error('Snapshot không hợp lệ');online=true;render(data);}catch{online=false;render(window.BOARD||snapshot);}finally{refreshing=false;}}
$('queue').addEventListener('input',event=>{if(event.target.dataset.note)drafts.set(event.target.dataset.note,event.target.value);});
$('queue').addEventListener('click',async event=>{const button=event.target.closest('button[data-ask]');if(!button)return;const askId=button.dataset.ask,choice=button.dataset.choice,note=drafts.get(askId)||'';if(pending.has(askId))return;if(['tra-loi','khac'].includes(choice)&&!note.trim()){notify('Phương án này cần anh gõ câu trả lời vào ô ghi chú trước khi gửi.');document.querySelector(`[data-note="${CSS.escape(askId)}"]`)?.focus();return;}if(!online){await copyCommand(askId,choice,note);return;}pending.add(askId);document.querySelectorAll('button[data-ask]').forEach(node=>{if(node.dataset.ask===askId)node.disabled=true;});try{const response=await fetch('/api/answer',{method:'POST',headers:{'Content-Type':'application/json','X-Company':'1'},body:JSON.stringify({askId,choice,note}),signal:AbortSignal.timeout(10000)});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||'Server chưa nhận câu trả lời');drafts.delete(askId);notify('Đã ghi câu trả lời.');await refresh();}catch(error){notify('Chưa xác nhận được câu trả lời: '+error.message+'. Kiểm tra trạng thái trước khi gửi lại.');await refresh();}finally{pending.delete(askId);document.querySelectorAll('button[data-ask]').forEach(node=>{if(node.dataset.ask===askId)node.disabled=false;});}});
// File mẫu không gọi API và không gửi quyết định vào dữ liệu thật.
const source=document.createElement('script');source.src=sample?'tests/fixtures/sample-board.js':'data/board.js';source.onload=()=>{render(window.BOARD||snapshot);refresh();};source.onerror=()=>{render(snapshot);if(location.protocol==='file:'||sample)notify('Chưa tải được dữ liệu file. Kiểm tra '+source.getAttribute('src')+'.');refresh();};document.head.append(source);setInterval(refresh,5000);
</script>
