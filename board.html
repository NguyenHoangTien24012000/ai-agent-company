<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Công ty SportsHub</title>
<style>
:root{color-scheme:light dark;--bg:#f2f4f7;--panel:#fff;--ink:#192638;--muted:#586779;--line:#d8e0e8;--accent:#126b57;--tint:#e7f4ee;--warn:#8a5000;--bad:#b52d38;--soft:#eaf0f6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 system-ui,-apple-system,sans-serif}button,input,textarea{font:inherit}a{color:var(--accent);overflow-wrap:anywhere}button{cursor:pointer;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--ink);padding:6px 10px}button:hover{border-color:var(--accent)}button:disabled{cursor:wait;opacity:.55}button.recommend{background:var(--accent);color:white;border-color:var(--accent)}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}header{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:19px;margin:0;letter-spacing:-.5px}h2{font-size:16px;margin:0;display:flex;gap:8px;align-items:center}h3{font-size:14px;margin:0}p{margin:5px 0}main{max-width:1600px;margin:auto;padding:20px 24px 36px;display:grid;gap:22px}.meta,.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.meta{color:var(--muted)}.pill{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:2px 6px;display:inline-block}.accent{color:var(--accent)}.warn{color:var(--warn)}.bad{color:var(--bad)}.muted,small{color:var(--muted)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}.count{font-size:11px;background:var(--soft);padding:1px 7px;border-radius:9px}.queue{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,350px),1fr));gap:10px}.card{min-width:0;border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:13px;overflow-wrap:anywhere}.ask{border-top:3px solid var(--accent)}.ask.boss-bug{border-top-color:var(--warn)}.ask h3{margin:7px 0}.context{white-space:pre-wrap;margin:8px 0}.context code,code{font:12px ui-monospace,monospace;background:var(--soft);padding:1px 4px;border-radius:3px;overflow-wrap:anywhere}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}textarea{display:block;width:100%;min-height:38px;resize:vertical;padding:7px 8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:5px;margin-top:4px}label{display:block;margin-top:10px;font-size:12px;color:var(--muted)}.links{display:flex;gap:5px 12px;flex-wrap:wrap;margin-top:7px;font-size:12px}.eye{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--accent);font-size:12px;text-decoration:none}.eye:hover{border-color:var(--accent)}#viewer{width:min(1280px,calc(100vw - 24px));height:calc(100vh - 24px);max-width:none;max-height:none;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);overflow:hidden}#viewer[open]{display:flex;flex-direction:column}#viewer::backdrop{background:#000a}.viewer-head{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--line)}.viewer-head h2{flex:1;min-width:0;font-size:14px}.viewer-body{flex:1;min-height:0;overflow:auto;background:var(--bg)}.viewer-body iframe{display:block;width:100%;height:100%;border:0;background:white}.viewer-body img{display:block;max-width:100%;margin:auto}.viewer-doc{max-width:860px;margin:auto;padding:20px 24px;line-height:1.6}.viewer-doc table{border-collapse:collapse;display:block;overflow-x:auto}.viewer-doc td,.viewer-doc th{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}.viewer-doc pre{background:var(--soft);padding:10px;border-radius:5px;overflow-x:auto;white-space:pre-wrap}.viewer-doc h1,.viewer-doc h2,.viewer-doc h3{margin:18px 0 6px;display:block}.viewer-doc h1{font-size:19px}.viewer-doc h2{font-size:16px}.rooms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.room-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:3px}.room-key{font-weight:750;letter-spacing:.7px;color:var(--accent)}.branch{font:11px ui-monospace,monospace;color:var(--muted);margin:6px 0 10px}.steps{list-style:none;padding:0;margin:10px 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}.steps li{font-size:10px;padding:5px 3px;text-align:center;background:var(--bg);border-radius:3px;color:var(--muted)}.steps .passed{color:var(--accent);background:var(--tint)}.steps .current{color:white;background:var(--accent);font-weight:700}.gates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:10px 0}.gate{font-size:11px;background:var(--bg);border:1px solid var(--line);padding:5px 6px;border-radius:4px}.gate.approved{background:var(--tint);color:var(--accent)}.gate.pending{color:var(--warn)}.gate span{display:block;color:var(--muted);font-size:10px}.lane{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;border-top:1px solid var(--line);padding:6px 0}.lane small{grid-column:1/-1}.lane-state{font-size:11px}.subheading{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:12px 0 5px}.bugs{border-top:1px solid var(--line);margin-top:10px;padding-top:9px}summary{cursor:pointer}.bug{margin-top:8px;padding:8px;background:var(--bg);border-radius:4px}.evidence,.overlap{padding:8px;margin-top:10px;border-radius:4px;background:var(--bg);font-size:12px}.evidence details{margin-top:5px}.events{border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}.event{padding:7px 12px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:135px 100px minmax(0,1fr);gap:10px;font-size:12px}.event:last-child{border-bottom:0}.event-message{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty{padding:18px;border:1px dashed var(--line);border-radius:5px;color:var(--muted)}#notice{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:min(620px,calc(100% - 24px));background:var(--ink);color:var(--panel);border-radius:7px;box-shadow:0 4px 24px #0003;padding:12px 15px;z-index:10;overflow-wrap:anywhere}#notice[hidden]{display:none}#notice textarea{min-height:65px}#notice button{margin-top:8px}.sample-label{color:var(--warn)}.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:12px}.tab{border:1px solid transparent;border-bottom:0;border-radius:5px 5px 0 0;background:none;padding:7px 12px;margin-bottom:-1px;color:var(--muted);display:flex;gap:6px;align-items:center}.tab[aria-selected=true]{background:var(--panel);border-color:var(--line);color:var(--ink);font-weight:650}.tab:hover{border-color:var(--line)}.task-form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:8px;align-items:start;margin-bottom:12px}.task-form input,.task-form textarea{margin:0;width:100%;padding:7px 8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:5px}.task-form textarea{min-height:34px}.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}.task h3{margin:4px 0}.task .context{margin:4px 0}.confirm{color:var(--bad)}button.danger{color:var(--bad)}button.danger.solid{background:var(--bad);border-color:var(--bad);color:var(--panel)}.done-list{border:1px solid var(--line);border-radius:7px;background:var(--panel);overflow:hidden}.done-row{border-bottom:1px solid var(--line)}.done-row:last-child{border-bottom:0}.done-row>summary{display:flex;gap:4px 12px;align-items:baseline;flex-wrap:wrap;padding:8px 12px}.done-row>summary .room-key{min-width:90px}.done-row>summary .done-title{flex:1 1 220px;min-width:0}.done-row>.card{border:0;border-top:1px solid var(--line);border-radius:0}
@media(max-width:1050px){.rooms{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.task-form{grid-template-columns:1fr}.tab{padding:6px 9px}header{padding:13px 14px}main{padding:16px 12px 28px;gap:20px}.rooms,.queue{grid-template-columns:1fr}.meta{gap:5px 10px;font-size:11px}.card{padding:11px}.event{grid-template-columns:76px 75px minmax(0,1fr);gap:6px;padding:8px;font-size:11px}.event time{font-size:10px}.section-head{align-items:baseline}.section-head>small{text-align:right;font-size:10px}}
@media(prefers-color-scheme:dark){:root{--bg:#111920;--panel:#1a2530;--ink:#e1e9f0;--muted:#a5b4c3;--line:#344453;--accent:#78d7b8;--tint:#213e37;--warn:#f1bd6a;--bad:#ff9399;--soft:#2b3948}.recommend,.steps .current{color:#11281f!important}}
</style>
</head>
<body>
<header><h1>Công ty SportsHub</h1><div class="meta"><span id="key-holder">Chìa khoá app: —</span><span class="pill" id="connection">Đang tải</span><span id="updated">Cập nhật: —</span><span id="sample-label" class="sample-label" hidden>Dữ liệu mẫu</span></div></header>
<main>
<section aria-labelledby="queue-title"><div class="section-head"><h2 id="queue-title">Việc của anh <span class="count" id="queue-count">0</span></h2><small>Cũ nhất trước · im lặng chưa phải đồng ý</small></div><div class="queue" id="queue"></div></section>
<section aria-label="Việc và phòng"><div class="tabs" role="tablist" id="tabs"><button type="button" class="tab" role="tab" data-tab="backlog" aria-controls="panel-tasks">Backlog <span class="count" id="count-backlog">0</span></button><button type="button" class="tab" role="tab" data-tab="todo" aria-controls="panel-tasks">Todo <span class="count" id="count-todo">0</span></button><button type="button" class="tab" role="tab" data-tab="doing" aria-controls="panel-doing">Doing <span class="count" id="count-doing">0</span></button><button type="button" class="tab" role="tab" data-tab="done" aria-controls="panel-done">Done <span class="count" id="count-done">0</span></button></div>
<div id="panel-tasks" role="tabpanel" hidden><form class="task-form" id="task-form"><input id="task-title" aria-label="Tiêu đề thẻ" placeholder="Việc mới…" maxlength="300" required><textarea id="task-note" aria-label="Ghi chú" placeholder="Ghi chú (tuỳ chọn)"></textarea><button type="submit" class="recommend" id="task-submit">Thêm</button></form><div class="tasks" id="tasks"></div></div>
<div id="panel-doing" role="tabpanel" hidden><div class="section-head"><small>Phòng đang chạy · 12 bước · 6 cổng duyệt</small></div><div class="rooms" id="rooms"></div></div>
<div id="panel-done" role="tabpanel" hidden><div class="section-head"><small>Mới xong trước · bấm một dòng để xem chi tiết</small></div><div class="done-list" id="done"></div></div></section>
<section aria-labelledby="events-title"><div class="section-head"><h2 id="events-title">Nhật ký <span class="count" id="event-count">0</span></h2><small>50 sự kiện mới nhất</small></div><div class="events" id="events"></div></section>
</main>
<dialog id="viewer" aria-labelledby="viewer-title"><div class="viewer-head"><h2 id="viewer-title"></h2><a id="viewer-tab" target="_blank" rel="noopener noreferrer">Mở tab riêng</a><button type="button" id="viewer-close">Đóng</button></div><div class="viewer-body" id="viewer-body"></div></dialog>
<div id="notice" role="status" aria-live="polite" hidden></div>
<script>
'use strict';
const STEPS=['hoi-dap','cho-goi','thiet-ke','kien-truc','ke-hoach-test','code','test','review','cho-check','chuan-bi-gop','cho-gop','xong'];
const STEP_LABELS=['Hỏi đáp','Chờ gói','Thiết kế','Kiến trúc','Kế hoạch test','Code','Test','Review','Chờ check','Chuẩn bị gộp','Chờ gộp','Xong'];
const GATES=['Gói phòng + hồ sơ tính năng','Bản ý tưởng thiết kế','Giao diện mẫu','Thiết kế Techlead','Check cuối (QA + review)','Cho gộp + push'];
const STATUS={active:'Đang làm',done:'Xong',cancelled:'Đã huỷ',running:'Đang chạy',waiting:'Đang chờ',closed:'Đã đóng',open:'Đang mở',fixing:'Đang sửa',retest:'Chờ kiểm lại',deferred:'Dời backlog'};
const KINDS={duyet:'Duyệt',quyet:'Quyết định',thaotac:'Thao tác'};
const EVENT_LABELS={room_opened:'Mở phòng',room_changed:'Cập nhật phòng',room_done:'Hoàn tất phòng',lane_changed:'Cập nhật lane',ask_opened:'Cần trả lời',ask_resolved:'Đã trả lời',ask_reopened:'Mở lại câu hỏi',ask_cancelled:'Rút câu hỏi',bug_opened:'Ghi nhận lỗi',bug_changed:'Cập nhật lỗi',key_requested:'Xin chìa khoá app (xếp hàng)',key_taken:'Nhận chìa khoá app',key_released:'Trả chìa khoá app',overlap:'File trùng giữa phòng',evidence:'Đối chiếu bằng chứng',note:'Ghi chú',lane_stale:'Lane đứng yên',lane_error:'Lane báo lỗi',thu_ky_silent:'Thư ký im lặng',db_down:'DB chung tắt',task_added:'Thêm thẻ việc',task_changed:'Cập nhật thẻ việc',task_removed:'Xoá thẻ việc',task_ask_answered:'Sếp trả lời câu của thẻ'};
const TAB_KEY='company-board-tab',TABS=['backlog','todo','doing','done'],COLUMN_LABELS={backlog:'Backlog',todo:'Todo'};
const sample=new URLSearchParams(location.search).get('sample')==='1';
let online=false,snapshot={rooms:[],myQueue:[],events:[],tasks:[],retros:[]},refreshing=false,queueSignature='',roomSignature='',eventSignature='',taskSignature='',doneSignature='',confirming=null;
// Tab đang chọn nhớ bằng localStorage; trình duyệt chặn bộ nhớ (file://, chế độ riêng tư) thì mặc định Doing.
let currentTab=(()=>{try{const value=localStorage.getItem(TAB_KEY);return TABS.includes(value)?value:'doing';}catch{return 'doing';}})();
const drafts=new Map(),pending=new Set();
const $=id=>document.getElementById(id);
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
function dateText(value){const date=new Date(value);return Number.isNaN(+date)?'—':date.toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'});}
function age(value){const minutes=Math.max(0,Math.floor((Date.now()-new Date(value))/60000));if(!Number.isFinite(minutes))return '—';return minutes<1?'Vừa xong':minutes<60?minutes+' phút':minutes<1440?Math.floor(minutes/60)+' giờ':Math.floor(minutes/1440)+' ngày';}
// Link trong repo/worktree đi qua /files của server: trang http:// mở link file:// thì trình duyệt chặn, không báo gì.
function safeUrl(value,room){const raw=String(value??'').trim();if(!raw||/[\u0000-\u001f\u007f]/.test(raw)||raw.startsWith('//')||raw.includes('\\'))return null;try{const home=room?.worktree||snapshot?.repoRoot;const base=home?new URL('file://'+home.replace(/\/$/,'')+'/').href:location.href;const url=new URL(raw,base);if(url.protocol==='file:')return '/files'+url.pathname;return ['https:','http:'].includes(url.protocol)?url.href:null;}catch{return null;}}
// Tên dễ đọc cho file kèm: Sếp không cần thấy đường dẫn (Sếp chốt 31/10).
function fileTitle(value){const path=String(value??'').split(/[?#]/)[0],name=path.split('/').pop(),stem=name.replace(/\.[^.]+$/,'');const known={spec:'Đặc tả',techlead:'Thiết kế kỹ thuật',review:'Kết quả review','qa-report':'Báo cáo kiểm thử','qa-plan':'Kế hoạch kiểm thử','nghiem-thu':'Trang nghiệm thu',comparison:'So sánh giao diện','trinh-gop':'Tóm tắt xin gộp',retro:'Bài rút kinh nghiệm'};if(known[stem])return known[stem];if(/^adr-nhap/.test(stem))return 'Biên bản quyết định (nháp)';if(/^check-/.test(stem))return 'Kết quả kiểm tra tự động';const pretty=stem.replace(/^\d+-/,'').replace(/[-_]+/g,' ');if(path.includes('/luong/'))return 'Sơ đồ luồng: '+pretty;if(path.includes('docs/features/'))return 'Hồ sơ tính năng: '+pretty;return pretty;}
const EYE='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
// File cần xem để duyệt: nút mắt, bấm là mở cửa sổ ngay trên board. Link ngoài (http) vẫn mở tab mới.
function attachment(value,room){const href=safeUrl(value,room);if(!href)return '';const external=!href.startsWith('/files/'),title=external?String(value):fileTitle(value);if(external)return `<a class="eye" href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">${EYE}${escapeHtml(title)}</a>`;return `<button type="button" class="eye" data-view="${escapeHtml(href)}" data-title="${escapeHtml(title)}">${EYE}${escapeHtml(title)}</button>`;}
function link(value,label,room){const href=safeUrl(value,room);if(!href)return escapeHtml(label||value);if(href.startsWith('/files/')){const text=label&&label!==value?label:fileTitle(value);return `<a href="${escapeHtml(href)}" data-view="${escapeHtml(href)}" data-title="${escapeHtml(text)}">${escapeHtml(text)}</a>`;}return `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label||value)}</a>`;}
// Chỉ xử lý các dấu markdown cho phép; mọi nội dung khác đều được thoát HTML.
function markdown(value,room){const text=String(value??'');const pattern=/`([^`\n]+)`|\*\*([^*\n]+)\*\*|\[([^\]\n]+)\]\(([^\s)]+)\)/g;let result='',last=0;for(const match of text.matchAll(pattern)){result+=escapeHtml(text.slice(last,match.index));result+=match[1]?`<code>${escapeHtml(match[1])}</code>`:match[2]?`<strong>${escapeHtml(match[2])}</strong>`:link(match[4],match[3],room);last=match.index+match[0].length;}return result+escapeHtml(text.slice(last));}
// Câu của thẻ chưa mở phòng (id T5-q1) ghi nguồn là thẻ: "T5 · Phòng truyền thống".
function askSource(item){if(!item.task)return item.room;const task=(snapshot.tasks||[]).find(task=>task.id===item.task);return item.task+(task?' · '+task.title:'');}
const openAsks=task=>(task.asks||[]).filter(ask=>ask.status==='open').length;
function renderQueue(items){$('queue-count').textContent=items.length;const signature=JSON.stringify([items,items.map(askSource)]);if(signature===queueSignature){document.querySelectorAll('[data-age]').forEach(node=>node.textContent=age(node.dataset.age));return;}queueSignature=signature;const focus=document.activeElement;const focusId=focus?.dataset?.note;const selection=focusId?[focus.selectionStart,focus.selectionEnd]:null;
 $('queue').innerHTML=items.length?items.map(item=>{const room=snapshot.rooms.find(room=>room.key===item.room);const isBug=!item.kind;return `<article class="card ask ${isBug?'boss-bug':''}"><div class="row"><strong>${escapeHtml(askSource(item))}</strong><span class="pill">${escapeHtml(isBug?'Lỗi cần anh quyết':KINDS[item.kind]||item.kind)}</span>${item.gate?`<span class="pill">Cổng ${escapeHtml(item.gate)}</span>`:''}<small data-age="${escapeHtml(item.createdAt)}" title="${escapeHtml(dateText(item.createdAt))}">${age(item.createdAt)}</small></div><h3>${escapeHtml(item.title)}</h3><small>${escapeHtml(item.id)}</small><div class="context">${markdown(isBug?item.steps:item.context,room)}</div><div class="links">${(isBug?item.shots||[]:item.links||[]).map(path=>attachment(path,room)).join('')}</div>${isBug?`<p class="warn">${escapeHtml(STATUS[item.status]||item.status)} · ${escapeHtml(item.assignee||'Chưa giao')}</p><p class="muted">Trao đổi với Manager để chốt hành vi; QA đóng lỗi sau khi kiểm lại.</p>`:`<label>Ghi chú cho ${escapeHtml(item.id)}<textarea data-note="${escapeHtml(item.id)}" placeholder="${(item.options||[]).some(option=>option.key==='tra-loi')?'Gõ câu trả lời của anh…':(item.options||[]).some(option=>option.key==='khac')?'Chỉ cần gõ khi chọn Khác (hoặc muốn ghi thêm)…':'Ghi rõ phần cần sửa hoặc lý do chọn…'}">${escapeHtml(drafts.get(item.id)||'')}</textarea></label><div class="actions">${(item.options||[]).map(option=>`<button type="button" data-ask="${escapeHtml(item.id)}" data-choice="${escapeHtml(option.key)}" class="${option.key===item.recommend?'recommend':''}" ${pending.has(item.id)?'disabled':''}>${escapeHtml(option.label)}${option.key===item.recommend?' · Đề xuất':''}</button>`).join('')}</div>`}</article>`;}).join(''):'<div class="empty">Chưa có việc cần anh trả lời.</div>';
 if(focusId){const replacement=[...document.querySelectorAll('[data-note]')].find(node=>node.dataset.note===focusId);if(replacement){replacement.focus({preventScroll:true});replacement.setSelectionRange(...selection);}}
}
function roomCard(room){const bugs=room.bugs||[],index=STEPS.indexOf(room.step),evidence=[...(room.evidence||[])].sort((a,b)=>new Date(b.at)-new Date(a.at))[0];return `<article class="card"><div class="room-head"><span class="room-key">${escapeHtml(room.key)}</span><span class="pill">${escapeHtml(STATUS[room.status]||room.status)}${snapshot.appKey?.room===room.key?' · 🔑':''}</span></div><h3>${escapeHtml(room.title)}</h3><div class="branch">${escapeHtml(room.branch)}</div><ol class="steps" aria-label="Tiến độ phòng">${STEPS.map((step,i)=>`<li class="${i===index?'current':i<index?'passed':''}" ${i===index?'aria-current="step"':''}>${i+1}. ${STEP_LABELS[i]}</li>`).join('')}</ol><div class="gates">${GATES.map((title,i)=>{const approved=room.gates?.[i+1];const waiting=(room.asks||[]).some(ask=>ask.status==='open'&&(Number(ask.gate)===i+1||(ask.alsoGates||[]).includes(i+1)));return `<div class="gate ${approved?'approved':waiting?'pending':''}" title="${escapeHtml(approved?'Đã duyệt '+dateText(approved.at):waiting?'Đang chờ duyệt':'Chưa tới')}">${approved?'✓':waiting?'⏳':'–'} Cổng ${i+1}<span>${title}</span></div>`;}).join('')}</div><div class="subheading">Vai & lane</div>${(room.roles||[]).filter(role=>!(room.lanes||[]).some(lane=>lane.role===role)).map(role=>`<div class="lane"><span>${escapeHtml(role)}</span><span class="lane-state muted">Chưa mở lane</span></div>`).join('')}${(room.lanes||[]).map(lane=>`<div class="lane"><span>${escapeHtml(lane.role)} <small>· ${escapeHtml(lane.model||'—')}</small></span><span class="lane-state ${lane.status==='running'?'accent':'muted'}">${escapeHtml(STATUS[lane.status]||lane.status)}</span><small>${escapeHtml(lane.handle)}${lane.note?' · '+escapeHtml(lane.note):''}</small></div>`).join('')}<details class="bugs" data-detail="${escapeHtml(room.key)}-bugs"><summary><strong>Lỗi chưa đóng: ${bugs.filter(bug=>!['closed','deferred'].includes(bug.status)).length}</strong><br><small>${['open','fixing','retest','closed','deferred'].map(status=>`${STATUS[status]} ${bugs.filter(bug=>bug.status===status).length}`).join(' · ')}</small></summary>${bugs.length?bugs.map(bug=>`<div class="bug"><strong>${escapeHtml(bug.id)} · ${escapeHtml(bug.title)}</strong><p class="${bug.severity==='high'?'bad':'muted'}">${escapeHtml(STATUS[bug.status]||bug.status)} · ${escapeHtml(bug.area)} · ${bug.severity==='high'?'Mức cao':'Bình thường'} · ${escapeHtml(bug.assignee||'Chưa giao')}</p><div class="context">${markdown(bug.steps,room)}</div><div class="links">${(bug.shots||[]).map(path=>attachment(path,room)).join('')}</div></div>`).join(''):'<p class="muted">Chưa ghi nhận lỗi.</p>'}</details><div class="links">${Object.entries(room.links||{}).filter(([,path])=>path).map(([name,path])=>link(path,({spec:'Đặc tả',featureDoc:'Hồ sơ tính năng',nghiemThu:'Nghiệm thu',qaReport:'Báo cáo QA',review:'Review'})[name]||name,room)).join('')}</div>${(room.overlaps||[]).map(overlap=>`<div class="overlap warn">⚠️ Trùng file với <strong>${escapeHtml(overlap.with)}</strong>${overlap.conflict?' · Có xung đột':''}<br>${(overlap.files||[]).map(file=>`<code>${escapeHtml(file)}</code>`).join(' ')}</div>`).join('')}${evidence?`<div class="evidence ${evidence.ok?'accent':'bad'}">${evidence.ok?'✅':'❌'} ${escapeHtml(evidence.claim)}<br><small>${dateText(evidence.at)}</small><details data-detail="${escapeHtml(room.key)}-evidence"><summary>Bằng chứng gần nhất</summary><p>Manager: ${escapeHtml(evidence.manager)}</p><p>Thư ký: ${escapeHtml(evidence.thuKy)}</p><code>${escapeHtml(evidence.cmd)}</code></details></div>`:'<p class="muted">Chưa có bằng chứng đối chiếu.</p>'}</article>`;}
function renderRooms(rooms){const signature=JSON.stringify([rooms,snapshot.appKey]);if(signature===roomSignature)return;roomSignature=signature;const expanded=new Set([...document.querySelectorAll('#rooms details[open]')].map(node=>node.dataset.detail));
 $('rooms').innerHTML=rooms.length?rooms.map(roomCard).join(''):'<div class="empty">Không có phòng đang chạy.</div>';
 document.querySelectorAll('#rooms details').forEach(node=>node.open=expanded.has(node.dataset.detail));
}
function retroHref(key){return online?'/retros/'+encodeURIComponent(key)+'.md':'state/retros/'+encodeURIComponent(key)+'.md';}
// Done: một dòng mỗi phòng, mở ra là thẻ phòng đầy đủ như ở Doing.
function renderDone(rooms){const retros=new Set(snapshot.retros||[]);const signature=JSON.stringify([rooms,[...retros],online]);if(signature===doneSignature)return;doneSignature=signature;const expanded=new Set([...document.querySelectorAll('#done details[open]')].map(node=>node.dataset.detail));
 $('done').innerHTML=rooms.length?rooms.map(room=>`<details class="done-row" data-detail="done-${escapeHtml(room.key)}"><summary><span class="room-key">${escapeHtml(room.key)}</span><span class="done-title">${escapeHtml(room.title)}</span><small title="Ngày xong">${escapeHtml(dateText(room.updatedAt))}</small>${retros.has(room.key)?`<a href="${escapeHtml(retroHref(room.key))}" target="_blank" rel="noopener noreferrer">Retro</a>`:''}</summary>${roomCard(room)}</details>`).join(''):'<div class="empty">Chưa có phòng xong trong 7 ngày gần nhất.</div>';
 document.querySelectorAll('#done details').forEach(node=>node.open=expanded.has(node.dataset.detail));
}
function renderTasks(){const column=currentTab==='todo'?'todo':'backlog',other=column==='todo'?'backlog':'todo';const tasks=(snapshot.tasks||[]).filter(task=>!task.room&&task.column===column).sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));$('task-submit').textContent='Thêm vào '+COLUMN_LABELS[column];const signature=JSON.stringify([column,tasks,confirming,[...pending]]);if(signature===taskSignature){document.querySelectorAll('#tasks [data-age]').forEach(node=>node.textContent=age(node.dataset.age));return;}taskSignature=signature;
 $('tasks').innerHTML=tasks.length?tasks.map(task=>{const busy=pending.has(task.id)?'disabled':'';const waiting=openAsks(task);return `<article class="card task"><div class="row"><strong>${escapeHtml(task.id)}</strong>${waiting?`<span class="pill warn" title="Trả lời ở mục Việc của anh">${waiting} câu chờ anh</span>`:''}<small data-age="${escapeHtml(task.createdAt)}" title="${escapeHtml(dateText(task.createdAt))}">${age(task.createdAt)}</small></div><h3>${escapeHtml(task.title)}</h3>${task.note?`<div class="context">${markdown(task.note)}</div>`:''}<div class="actions">${confirming===task.id?`<span class="confirm">Xoá thẻ ${escapeHtml(task.id)}?</span><button type="button" class="danger solid" data-task="${escapeHtml(task.id)}" data-action="remove" ${busy}>Xoá</button><button type="button" data-task="${escapeHtml(task.id)}" data-action="cancel">Thôi</button>`:`<button type="button" data-task="${escapeHtml(task.id)}" data-action="move" data-column="${other}" ${busy}>${column==='backlog'?'→ Todo':'← Backlog'}</button><button type="button" class="danger" data-task="${escapeHtml(task.id)}" data-action="confirm" ${busy}>Xoá…</button>`}</div></article>`;}).join(''):`<div class="empty">${column==='backlog'?'Backlog trống. Ý tưởng chưa làm ngay thì ghi vào đây.':'Todo trống. Việc anh đã cho làm, chờ mở phòng, nằm ở đây.'}</div>`;
}
function renderTabs(){const open=(snapshot.tasks||[]).filter(task=>!task.room);const counts={backlog:open.filter(task=>task.column==='backlog').length,todo:open.filter(task=>task.column==='todo').length,doing:snapshot.rooms.filter(room=>room.status!=='done').length,done:snapshot.rooms.filter(room=>room.status==='done').length};for(const tab of TABS)$('count-'+tab).textContent=counts[tab];document.querySelectorAll('[data-tab]').forEach(node=>{const selected=node.dataset.tab===currentTab;node.setAttribute('aria-selected',String(selected));node.tabIndex=selected?0:-1;});$('panel-tasks').hidden=!['backlog','todo'].includes(currentTab);$('panel-doing').hidden=currentTab!=='doing';$('panel-done').hidden=currentTab!=='done';}
function renderEvents(events){$('event-count').textContent=events.length;const signature=JSON.stringify(events);if(signature===eventSignature)return;eventSignature=signature;$('events').innerHTML=events.length?events.map(event=>{const detail=[EVENT_LABELS[event.type]||event.type,event.title,event.text,event.message,event.note,event.askId||event.bugId||event.taskId,event.change==='start'&&event.linkedRoom?'mở phòng '+event.linkedRoom:null,event.role&&event.handle?event.role+' '+event.handle:null,event.minutes!=null?event.minutes+' phút không động tĩnh':null,event.choice,event.status?STATUS[event.status]||event.status:null,event.claim,event.ok===false?'Không khớp':null].filter(Boolean).join(' · ');return `<div class="event"><time datetime="${escapeHtml(event.ts)}">${dateText(event.ts)}</time><strong>${escapeHtml(event.room||event.task||'Công ty')}</strong><span class="event-message" title="${escapeHtml(detail)}">${escapeHtml(detail)}</span></div>`;}).join(''):'<div class="empty">Chưa có sự kiện.</div>';}
function render(data){snapshot={...data,rooms:data.rooms||[],myQueue:data.myQueue||[],events:data.events||[],tasks:data.tasks||[],retros:data.retros||[]};$('connection').textContent=online?'● Đã nối':'○ Chỉ đọc file';$('connection').classList.toggle('accent',online);$('key-holder').textContent='🔑 Chìa khoá app: '+(snapshot.appKey?.room||'Chưa ai giữ')+((snapshot.keyQueue||[]).length?' · chờ: '+snapshot.keyQueue.map(q=>q.room).join(', '):'');$('updated').textContent='Cập nhật: '+dateText(snapshot.generatedAt);$('sample-label').hidden=!sample;renderQueue([...snapshot.myQueue].sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt)));renderTabs();renderTasks();renderRooms(snapshot.rooms.filter(room=>room.status!=='done'));renderDone(snapshot.rooms.filter(room=>room.status==='done').sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt)));renderEvents([...snapshot.events].sort((a,b)=>new Date(b.ts)-new Date(a.ts)).slice(0,50));}
function notify(message,command){const node=$('notice');node.hidden=false;node.innerHTML=`<div>${escapeHtml(message)}</div>${command?`<textarea aria-label="Lệnh để chép" readonly>${escapeHtml(command)}</textarea>`:''}<button type="button">Đóng</button>`;node.querySelector('button').onclick=()=>node.hidden=true;if(command){node.querySelector('textarea').focus();node.querySelector('textarea').select();}}
// Giữ nguyên dạng lệnh dễ đọc, đồng thời bảo vệ ký tự shell trong lựa chọn và ghi chú.
function shellQuote(value){const text=String(value);return /^[a-zA-Z0-9_-]+$/.test(text)?text:"'"+text.replace(/'/g,"'\\''")+"'";}
async function copyCommand(askId,choice,note){await copyText(`python3 ~/sportshub-company/bin/company.py ask resolve ${shellQuote(askId)} --choice ${shellQuote(choice)} --via board${note?' --note '+shellQuote(note):''}`,/^T[1-9][0-9]*-q/.test(askId)?'dán vào chat Thư ký':'dán vào terminal Manager');}
async function copyText(command,where){let copied=false;try{await navigator.clipboard.writeText(command);copied=true;}catch{const textarea=document.createElement('textarea');textarea.value=command;textarea.style.cssText='position:fixed;left:0;top:0;opacity:0';document.body.append(textarea);textarea.select();try{copied=document.execCommand('copy');}catch{}textarea.remove();}notify(copied?`Đã chép, ${where}. Chưa ghi gì.`:`Không thể tự chép. Chép lệnh bên dưới rồi ${where}.`,command);}
async function refresh(){if(refreshing||sample||location.protocol==='file:')return;refreshing=true;try{const response=await fetch('/api/state',{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!response.ok)throw new Error('Không tải được trạng thái');const data=await response.json();if(!Array.isArray(data.rooms)||!Array.isArray(data.myQueue)||!Array.isArray(data.events))throw new Error('Snapshot không hợp lệ');online=true;render(data);}catch{online=false;render(window.BOARD||snapshot);}finally{refreshing=false;}}
// Cửa sổ xem file. Server gắn CSP sandbox cho HTML/SVG ở mọi đường mở; thuộc tính sandbox trên iframe là lớp thứ hai.
function docHtml(text,room){const lines=String(text).replace(/\r/g,'').split('\n'),out=[];let i=0;const cells=line=>line.trim().replace(/^\||\|$/g,'').split('|').map(cell=>cell.trim());while(i<lines.length){const line=lines[i];if(/^```/.test(line)){const code=[];i++;while(i<lines.length&&!/^```/.test(lines[i]))code.push(lines[i++]);i++;out.push(`<pre>${escapeHtml(code.join('\n'))}</pre>`);continue;}const heading=line.match(/^(#{1,4})\s+(.*)/);if(heading){const level=Math.min(heading[1].length,3);out.push(`<h${level}>${markdown(heading[2],room)}</h${level}>`);i++;continue;}if(/^\s*\|/.test(line)&&/^\s*\|[\s:|-]+\|?\s*$/.test(lines[i+1]||'')){const head=cells(line);i+=2;const rows=[];while(i<lines.length&&/^\s*\|/.test(lines[i]))rows.push(cells(lines[i++]));out.push(`<table><thead><tr>${head.map(c=>`<th>${markdown(c,room)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${markdown(c,room)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);continue;}if(/^\s*([-*]|\d+\.)\s+/.test(line)){const items=[];while(i<lines.length&&/^\s*([-*]|\d+\.)\s+/.test(lines[i]))items.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/,''));out.push(`<ul>${items.map(item=>`<li>${markdown(item,room)}</li>`).join('')}</ul>`);continue;}if(!line.trim()){i++;continue;}out.push(`<p>${markdown(line,room)}</p>`);i++;}return `<div class="viewer-doc">${out.join('')}</div>`;}
function fileNameOf(href){const raw=href.split('/').pop();try{return decodeURIComponent(raw).toLowerCase();}catch{return raw.toLowerCase();}}
async function openViewer(href,title){const body=$('viewer-body'),name=fileNameOf(href);$('viewer-title').textContent=title;$('viewer-tab').href=href;$('viewer-tab').dataset.current=href;body.innerHTML='';if(!$('viewer').open)$('viewer').showModal();if(/\.(png|jpe?g|webp|gif|svg)$/.test(name)){const img=document.createElement('img');img.src=href;img.alt=title;body.append(img);return;}if(/\.pdf$/.test(name)){const frame=document.createElement('iframe');frame.title=title;frame.src=href;body.append(frame);return;}if(/\.html?$/.test(name)){const frame=document.createElement('iframe');frame.title=title;frame.setAttribute('sandbox','allow-scripts allow-popups allow-downloads');frame.src=href;body.append(frame);return;}body.innerHTML='<p class="viewer-doc muted">Đang mở…</p>';try{const response=await fetch(href);if(!response.ok)throw new Error();const text=await response.text();if($('viewer-tab').dataset.current!==href)return;body.innerHTML=/\.md$/.test(name)?docHtml(text,{worktree:decodeURIComponent(href.replace(/^\/files/,'').replace(/\/[^/]*$/,''))}):`<div class="viewer-doc"><pre>${escapeHtml(text)}</pre></div>`;}catch{body.innerHTML='<p class="viewer-doc bad">Không mở được file này. Có thể phòng đã dọn xong và file không còn.</p>';}}
document.addEventListener('click',event=>{const target=event.target.closest?.('[data-view]');if(!target)return;event.preventDefault();openViewer(target.dataset.view,target.dataset.title||'');});
$('viewer-close').addEventListener('click',()=>$('viewer').close());
$('viewer').addEventListener('click',event=>{if(event.target===$('viewer'))$('viewer').close();});
$('viewer').addEventListener('close',()=>{$('viewer-body').innerHTML='';});
$('queue').addEventListener('input',event=>{if(event.target.dataset.note)drafts.set(event.target.dataset.note,event.target.value);});
$('queue').addEventListener('click',async event=>{const button=event.target.closest('button[data-ask]');if(!button)return;const askId=button.dataset.ask,choice=button.dataset.choice,note=drafts.get(askId)||'';if(pending.has(askId))return;if(['tra-loi','khac'].includes(choice)&&!note.trim()){notify('Phương án này cần anh gõ câu trả lời vào ô ghi chú trước khi gửi.');document.querySelector(`[data-note="${CSS.escape(askId)}"]`)?.focus();return;}if(!online){await copyCommand(askId,choice,note);return;}pending.add(askId);document.querySelectorAll('button[data-ask]').forEach(node=>{if(node.dataset.ask===askId)node.disabled=true;});try{const response=await fetch('/api/answer',{method:'POST',headers:{'Content-Type':'application/json','X-Company':'1'},body:JSON.stringify({askId,choice,note}),signal:AbortSignal.timeout(10000)});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||'Server chưa nhận câu trả lời');drafts.delete(askId);notify('Đã ghi câu trả lời.');await refresh();}catch(error){notify('Chưa xác nhận được câu trả lời: '+error.message+'. Kiểm tra trạng thái trước khi gửi lại.');await refresh();}finally{pending.delete(askId);document.querySelectorAll('button[data-ask]').forEach(node=>{if(node.dataset.ask===askId)node.disabled=false;});}});
$('tabs').addEventListener('click',event=>{const button=event.target.closest('[data-tab]');if(!button)return;currentTab=button.dataset.tab;confirming=null;try{localStorage.setItem(TAB_KEY,currentTab);}catch{}taskSignature='';render(snapshot);});
$('tabs').addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight'].includes(event.key))return;const index=(TABS.indexOf(currentTab)+(event.key==='ArrowRight'?1:TABS.length-1))%TABS.length;document.querySelector(`[data-tab="${TABS[index]}"]`).click();document.querySelector(`[data-tab="${TABS[index]}"]`).focus();});
// Không có server (file://): chép lệnh company.py tương ứng để dán vào terminal Thư ký, như nút trả lời.
function taskCommand(body){const base='python3 ~/sportshub-company/bin/company.py task ';if(body.action==='add')return base+`add --title ${shellQuote(body.title)} --column ${body.column}${body.note?' --note '+shellQuote(body.note):''}`;if(body.action==='move')return base+`move ${shellQuote(body.id)} --column ${body.column}`;return base+`remove ${shellQuote(body.id)}`;}
async function postTask(body,done){if(!online){await copyText(taskCommand(body),'dán vào terminal Thư ký');return false;}try{const response=await fetch('/api/task',{method:'POST',headers:{'Content-Type':'application/json','X-Company':'1'},body:JSON.stringify(body),signal:AbortSignal.timeout(10000)});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||'Server chưa nhận thẻ');done?.(result.task);return true;}catch(error){notify('Chưa ghi được thẻ việc: '+error.message);return false;}finally{await refresh();}}
$('task-form').addEventListener('submit',async event=>{event.preventDefault();const title=$('task-title').value.trim(),note=$('task-note').value.trim();if(!title){$('task-title').focus();return;}const column=currentTab==='todo'?'todo':'backlog';$('task-submit').disabled=true;try{if(await postTask({action:'add',title,note,column})){$('task-title').value='';$('task-note').value='';$('task-title').focus();}}finally{$('task-submit').disabled=false;}});
$('tasks').addEventListener('click',async event=>{const button=event.target.closest('button[data-task]');if(!button)return;const id=button.dataset.task,action=button.dataset.action;if(action==='confirm'||action==='cancel'){confirming=action==='confirm'?id:null;renderTasks();return;}if(pending.has(id))return;pending.add(id);renderTasks();try{await postTask(action==='move'?{action,id,column:button.dataset.column}:{action:'remove',id});}finally{pending.delete(id);if(confirming===id)confirming=null;renderTasks();}});
// File mẫu không gọi API và không gửi quyết định vào dữ liệu thật.
const source=document.createElement('script');source.src=sample?'tests/fixtures/sample-board.js':'data/board.js';source.onload=()=>{render(window.BOARD||snapshot);refresh();};source.onerror=()=>{render(snapshot);if(location.protocol==='file:'||sample)notify('Chưa tải được dữ liệu file. Kiểm tra '+source.getAttribute('src')+'.');refresh();};document.head.append(source);setInterval(refresh,5000);
</script>
